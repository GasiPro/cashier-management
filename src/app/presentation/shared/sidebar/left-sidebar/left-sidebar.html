<nav class="w-16 h-screen sticky top-0 left-0 bg-white border-r border-gray-200 flex flex-col items-center py-4 gap-2 flex-shrink-0 z-30"
     aria-label="Navigation principale">
  <button (click)="goHome()" [attr.aria-current]="isHomeActive() ? 'page' : null" title="Accueil" aria-label="Accueil"
    [class]="iconButtonClass(isHomeActive())"
    class="group relative w-10 h-10 rounded-full flex items-center justify-center transition-colors
           focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10" />
    </svg>
    <span class="pointer-events-none absolute left-full ml-2 top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md
                 bg-[#1A1A1A] px-2 py-1 text-xs text-white opacity-0 group-hover:opacity-100 transition-opacity z-40">
      Accueil
    </span>
  </button>
  <button (click)="openCalculatrice()" [attr.aria-current]="calculatriceSlot() !== null ? 'page' : null" title="Calculatrice" aria-label="Calculatrice"
    [class]="iconButtonClass(calculatriceSlot() !== null)"
    class="group relative w-10 h-10 rounded-full flex items-center justify-center transition-colors
           focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 6h8M8 10.5h.01M12 10.5h.01M16 10.5h.01M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01M16 17.5h.01" />
    </svg>
    <span class="pointer-events-none absolute left-full ml-2 top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md
                 bg-[#1A1A1A] px-2 py-1 text-xs text-white opacity-0 group-hover:opacity-100 transition-opacity z-40">
      Calculatrice
    </span>
  </button>
  <button (click)="openMemo()" [attr.aria-current]="memoSlot() !== null ? 'page' : null" title="Mémo" aria-label="Mémo"
    [class]="iconButtonClass(memoSlot() !== null)"
    class="group relative w-10 h-10 rounded-full flex items-center justify-center transition-colors
           focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6a2 2 0 012 2v14l-5-3-5 3V5a2 2 0 012-2z" />
    </svg>
    <span class="pointer-events-none absolute left-full ml-2 top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md
                 bg-[#1A1A1A] px-2 py-1 text-xs text-white opacity-0 group-hover:opacity-100 transition-opacity z-40">
      Mémo
    </span>
  </button>
  <div class="flex-1"></div>
  <button (click)="goToSettings()" [attr.aria-current]="isSettingsActive() ? 'page' : null" title="Réglages" aria-label="Réglages"
    [class]="iconButtonClass(isSettingsActive())"
    class="group relative w-10 h-10 rounded-full flex items-center justify-center transition-colors
           focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    <span class="pointer-events-none absolute left-full ml-2 top-1/2 -translate-y-1/2 whitespace-nowrap rounded-md
                 bg-[#1A1A1A] px-2 py-1 text-xs text-white opacity-0 group-hover:opacity-100 transition-opacity z-40">
      Réglages
    </span>
  </button>
</nav>

<div *ngIf="calculatriceSlot() !== null"
     [class]="calculatricePanelClass()"
     role="dialog" aria-label="Calculatrice">
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
      <span class="text-sm font-semibold text-[#1A1A1A]">Calculatrice</span>
      <button (click)="closeCalculatrice()" title="Fermer" aria-label="Fermer la calculatrice"
        class="w-6 h-6 flex items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="px-4 pt-3 pb-2">
      <div class="w-full rounded-lg bg-gray-50 border border-gray-100 px-3 py-3 text-right">
        <span class="block text-2xl font-medium text-[#1A1A1A] truncate">{{ display() }}</span>
      </div>
    </div>
    <div class="grid grid-cols-4 gap-1.5 px-4 pb-4">
      <button (click)="clearPressed()"
        class="col-span-2 h-10 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm font-medium text-[#1A1A1A] transition-colors">C</button>
      <button (click)="backspacePressed()"
        class="h-10 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm font-medium text-[#1A1A1A] transition-colors">⌫</button>
      <button (click)="operatorPressed('÷')"
        class="h-10 rounded-lg bg-[#EFF4FA] hover:bg-[#E1EAF4] text-sm font-medium text-[#1E3A5F] transition-colors">÷</button>

      <button (click)="digitPressed('7')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">7</button>
      <button (click)="digitPressed('8')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">8</button>
      <button (click)="digitPressed('9')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">9</button>
      <button (click)="operatorPressed('×')"
        class="h-10 rounded-lg bg-[#EFF4FA] hover:bg-[#E1EAF4] text-sm font-medium text-[#1E3A5F] transition-colors">×</button>

      <button (click)="digitPressed('4')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">4</button>
      <button (click)="digitPressed('5')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">5</button>
      <button (click)="digitPressed('6')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">6</button>
      <button (click)="operatorPressed('−')"
        class="h-10 rounded-lg bg-[#EFF4FA] hover:bg-[#E1EAF4] text-sm font-medium text-[#1E3A5F] transition-colors">−</button>

      <button (click)="digitPressed('1')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">1</button>
      <button (click)="digitPressed('2')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">2</button>
      <button (click)="digitPressed('3')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">3</button>
      <button (click)="operatorPressed('+')"
        class="h-10 rounded-lg bg-[#EFF4FA] hover:bg-[#E1EAF4] text-sm font-medium text-[#1E3A5F] transition-colors">+</button>

      <button (click)="toggleSignPressed()"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">±</button>
      <button (click)="digitPressed('0')"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">0</button>
      <button (click)="decimalPressed()"
        class="h-10 rounded-lg bg-white hover:bg-gray-50 border border-gray-100 text-sm font-medium text-[#1A1A1A] transition-colors">,</button>
      <button (click)="equalsPressed()"
        class="h-10 rounded-lg bg-[#1E3A5F] hover:bg-[#183050] text-sm font-medium text-white transition-colors">=</button>
    </div>
  </div>
<div *ngIf="memoSlot() !== null"
     [class]="memoPanelClass()"
     role="dialog" aria-label="Mémo">
  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 flex-shrink-0">
    <span class="text-sm font-semibold text-[#1A1A1A]">Memo</span>
    <button (click)="closeMemo()" title="Fermer" aria-label="Fermer le mémo"
      class="w-6 h-6 flex items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <textarea [value]="memoText()" (input)="memoTextChanged($event)"
    placeholder="Écrivez une note…"
    class="flex-1 w-full resize-none px-4 py-3 text-sm text-[#1A1A1A] placeholder-gray-400
           focus:outline-none"></textarea>
</div>

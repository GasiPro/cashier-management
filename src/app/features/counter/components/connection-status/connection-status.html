<button (click)="store.showServerPanel = !store.showServerPanel"
  class="flex items-center gap-1.5 text-xs font-medium border rounded-md px-3 py-1.5 transition-colors
         focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]"
  [class]="store.wsConnected()
    ? 'border-emerald-200 text-emerald-700 bg-emerald-50 hover:bg-emerald-100'
    : store.waitingApproval()
      ? 'border-amber-200 text-amber-700 bg-amber-50 hover:bg-amber-100'
      : 'border-red-200 text-red-600 bg-red-50 hover:bg-red-100'">
  <span class="w-1.5 h-1.5 rounded-full inline-block"
    [class]="store.wsConnected()
      ? 'bg-emerald-400 animate-pulse'
      : store.waitingApproval()
        ? 'bg-amber-400 animate-pulse'
        : 'bg-red-400'">
  </span>
  <span class="hidden sm:inline">
    @if (store.wsConnected()) { Connecté }
    @else if (store.waitingApproval()) { Approbation… }
    @else { Déconnecté }
  </span>
  <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
  </svg>
</button>

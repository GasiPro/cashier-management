<div class="absolute inset-0 z-30 flex items-center justify-center px-4" (click)="closed.emit()"
     (keydown.escape)="closed.emit()">
  <div class="absolute inset-0 bg-black/30"></div>
  <div id="payment-order-modal" class="relative bg-white rounded-xl shadow-2xl w-full max-w-sm
              overflow-y-auto flex flex-col"
       role="dialog" aria-modal="true" aria-labelledby="payment-order-heading"
       (click)="$event.stopPropagation()">
    <div class="px-6 py-4 border-b border-gray-100 shrink-0">
      <p class="text-xs text-gray-400 font-medium uppercase tracking-wide">Paiement</p>
      <h2 id="payment-order-heading" class="text-xl font-bold text-[#1E3A5F] tabular-nums leading-tight">
        {{ formatGroupId(group.groupId) }}
      </h2>
    </div>
    <div class="px-6 py-4">
      <div class="flex items-center justify-between mb-4">
        <span class="text-sm text-gray-500">Total à payer</span>
        <span class="text-xl font-bold text-[#1A1A1A] tabular-nums">{{ group.totalAmount | money }}</span>
      </div>
      <p class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5" id="payment-method-label">
        Mode de paiement
      </p>
      <div class="grid grid-cols-2 gap-2" role="radiogroup" aria-labelledby="payment-method-label">
        @for (m of methods; track m.id) {
        <button type="button" role="radio" [attr.aria-checked]="method() === m.id"
          (click)="methodChange.emit(m.id)"
          [class]="method() === m.id
            ? 'px-4 py-3 rounded-lg text-sm font-semibold border border-[#1E3A5F] bg-[#1E3A5F]/5 text-[#1E3A5F]'
            : 'px-4 py-3 rounded-lg text-sm font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50'"
          class="active:scale-95 transition-all
                 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1E3A5F]">
          {{ m.label }}
        </button>
        }
      </div>
      @if (method() === 'mobile_money') {
      <div class="mt-3 flex items-center justify-between text-sm bg-gray-50 rounded-lg px-3 py-2.5">
        <span class="text-gray-500">Numéro mobile money</span>
        <span class="font-semibold text-gray-700 tabular-nums">{{ mobileMoneyNumber }}</span>
      </div>
      }
    </div>
    <div class="px-6 py-4 border-t border-gray-100 shrink-0 flex items-center gap-2">
      <button (click)="closed.emit()" [disabled]="busy()"
        class="flex-1 px-4 py-3 rounded-lg text-sm font-semibold border border-gray-200 text-gray-600
               hover:bg-gray-50 active:scale-95 transition-all
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1E3A5F]">
        Retour
      </button>
      <button (click)="confirmed.emit()" [disabled]="busy()" autofocus
        class="flex-1 bg-[#1E3A5F] text-white text-sm font-semibold py-3 rounded-lg
               hover:bg-[#16304f] active:scale-95 transition-all
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1E3A5F]">
        Confirmer le paiement
      </button>
    </div>
  </div>
</div>

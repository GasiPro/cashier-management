<div class="fixed inset-0 bg-black/40 flex items-center justify-center px-4 z-50"
     role="dialog" aria-modal="true" aria-labelledby="admin-modal-title"
     (click)="closed.emit()">
  <div class="w-full max-w-sm bg-white rounded-lg shadow-xl p-6" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between mb-5">
      <h2 id="admin-modal-title" class="text-lg font-semibold text-[#1A1A1A]">Accès administrateur</h2>
      <button type="button" (click)="closed.emit()" aria-label="Fermer"
        class="text-gray-400 hover:text-gray-600 transition-colors
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F] rounded">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="space-y-4">
      <div>
        <label for="admin-username" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">
          Identifiant
        </label>
        <input
          id="admin-username"
          type="text"
          [(ngModel)]="username"
          (keydown.enter)="submitted.emit()"
          autocomplete="username"
          autofocus
          [attr.aria-invalid]="error() ? true : null"
          aria-describedby="admin-login-error"
          class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm text-[#1A1A1A]
                 focus:outline-none focus:border-[#1E3A5F] transition-colors placeholder-gray-300" />
      </div>
      <div>
        <label for="admin-password" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">
          Mot de passe
        </label>
        <div class="flex items-center gap-2">
          <input
            id="admin-password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            (keydown.enter)="submitted.emit()"
            placeholder="••••••••"
            autocomplete="current-password"
            [attr.aria-invalid]="error() ? true : null"
            aria-describedby="admin-login-error"
            class="flex-1 border border-gray-200 rounded-lg px-4 py-3 text-sm text-[#1A1A1A]
                   focus:outline-none focus:border-[#1E3A5F] transition-colors placeholder-gray-300" />
          <button type="button" (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="showPassword()"
            [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            class="flex-shrink-0 border border-gray-200 bg-white rounded-lg p-3
                   hover:bg-gray-50 transition-colors
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
            @if (showPassword()) {
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.88 9.88" />
            </svg>
            } @else {
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            }
          </button>
        </div>
      </div>
      <p id="admin-login-error" role="alert" aria-live="assertive" class="text-xs text-red-600">
        {{ errorText() }}
      </p>
      <button
        (click)="submitted.emit()"
        [disabled]="!username().trim() || !password() || authenticating()"
        [attr.aria-busy]="authenticating()"
        class="w-full bg-[#1E3A5F] text-white text-sm font-semibold py-3 rounded-lg
               hover:bg-[#16304f] active:scale-95 transition-all disabled:opacity-40 disabled:cursor-not-allowed
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#1E3A5F]">
        {{ authenticating() ? 'Connexion…' : 'Entrer' }}
      </button>
    </div>
  </div>
</div>

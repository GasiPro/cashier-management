<div class="max-w-3xl mx-auto">
  <a routerLink="/admin/reglages" aria-label="Retour"
    class="inline-flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-600 transition-colors mb-4
           focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F] rounded">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
    Retour
  </a>
  <div class="space-y-6">
    @if (loading()) {
    <p class="text-sm text-gray-400 italic py-4">Chargement…</p>
    } @else {
    <section aria-labelledby="datetime-mode-heading"
      class="bg-white border border-gray-200 rounded-xl p-5 sm:p-6">
      <div class="mb-4">
        <h2 id="datetime-mode-heading" class="text-base font-semibold text-[#1A1A1A]">
          Mode
        </h2>
        <p class="text-xs text-gray-400 mt-0.5">
          Automatique : horloge du système.
        </p>
      </div>
      <div role="radiogroup" aria-labelledby="datetime-mode-heading" class="flex flex-wrap gap-2">
        <button type="button" role="radio" [attr.aria-checked]="autoDraft()"
          (click)="selectAuto(true)"
          class="px-4 py-2 rounded-lg text-sm font-semibold border transition-colors
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]"
          [class.bg-[#1E3A5F]]="autoDraft()"
            [class.text-white]="autoDraft()"
            [class.border-[#1E3A5F]]="autoDraft()"
            [class.bg-white]="!(autoDraft())"
            [class.text-gray-600]="!(autoDraft())"
            [class.border-gray-200]="!(autoDraft())">
          Automatique
        </button>
        <button type="button" role="radio" [attr.aria-checked]="!autoDraft()"
          (click)="selectAuto(false)"
          class="px-4 py-2 rounded-lg text-sm font-semibold border transition-colors
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]"
          [class.bg-[#1E3A5F]]="!autoDraft()"
            [class.text-white]="!autoDraft()"
            [class.border-[#1E3A5F]]="!autoDraft()"
            [class.bg-white]="!(!autoDraft())"
            [class.text-gray-600]="!(!autoDraft())"
            [class.border-gray-200]="!(!autoDraft())">
          Manuel
        </button>
      </div>
    </section>
    <section aria-labelledby="datetime-clock-heading"
      class="bg-white border border-gray-200 rounded-xl p-5 sm:p-6">
      <div class="mb-4">
        <h2 id="datetime-clock-heading" class="text-base font-semibold text-[#1A1A1A]">
          Date et heure
        </h2>
        <p class="text-xs text-gray-400 mt-0.5">
          Modifiable en mode manuel.
        </p>
      </div>
      <div class="space-y-4">
        <div>
          <label for="datetime-timezone"
            class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
            Fuseau horaire
          </label>
          <select id="datetime-timezone" [disabled]="autoDraft()"
            [value]="timezoneDraft()"
            (change)="selectTimeZone($any($event.target).value)"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-[#1A1A1A]
                   focus:outline-none focus:border-[#1E3A5F] transition-colors disabled:opacity-40">
            @for (zone of timeZones; track zone) {
            <option [value]="zone" [selected]="zone === timezoneDraft()">{{ zone }}</option>
            }
          </select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="datetime-date"
              class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
              Date
            </label>
            <input id="datetime-date" type="date" [disabled]="autoDraft()"
              [value]="dateDraft()"
              (input)="onDateInput($any($event.target).value)"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-[#1A1A1A]
                   focus:outline-none focus:border-[#1E3A5F] transition-colors disabled:opacity-40" />
          </div>
          <div>
            <label for="datetime-time"
              class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
              Heure
            </label>
            <input id="datetime-time" type="time" step="1" [disabled]="autoDraft()"
              [value]="timeDraft()"
              (input)="onTimeInput($any($event.target).value)"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-[#1A1A1A]
                   focus:outline-none focus:border-[#1E3A5F] transition-colors disabled:opacity-40" />
          </div>
        </div>
      </div>
    </section>
    <section aria-labelledby="datetime-format-heading"
      class="bg-white border border-gray-200 rounded-xl p-5 sm:p-6">
      <div class="mb-4">
        <h2 id="datetime-format-heading" class="text-base font-semibold text-[#1A1A1A]">
          Formats
        </h2>
        <p class="text-xs text-gray-400 mt-0.5">
          Affichage de l'heure et de la date.
        </p>
      </div>
      <div class="space-y-4">
        <div>
          <span id="datetime-hour-heading"
            class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
            Heure
          </span>
          <div role="radiogroup" aria-labelledby="datetime-hour-heading" class="flex flex-wrap gap-2">
            <button type="button" role="radio" [attr.aria-checked]="!hour12Draft()"
              (click)="hour12Draft.set(false)"
              class="px-4 py-2 rounded-lg text-sm font-semibold border transition-colors
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]"
              [class.bg-[#1E3A5F]]="!hour12Draft()"
            [class.text-white]="!hour12Draft()"
            [class.border-[#1E3A5F]]="!hour12Draft()"
            [class.bg-white]="!(!hour12Draft())"
            [class.text-gray-600]="!(!hour12Draft())"
            [class.border-gray-200]="!(!hour12Draft())">
              24 heures
            </button>
            <button type="button" role="radio" [attr.aria-checked]="hour12Draft()"
              (click)="hour12Draft.set(true)"
              class="px-4 py-2 rounded-lg text-sm font-semibold border transition-colors
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]"
              [class.bg-[#1E3A5F]]="hour12Draft()"
            [class.text-white]="hour12Draft()"
            [class.border-[#1E3A5F]]="hour12Draft()"
            [class.bg-white]="!(hour12Draft())"
            [class.text-gray-600]="!(hour12Draft())"
            [class.border-gray-200]="!(hour12Draft())">
              12 heures
            </button>
          </div>
        </div>
        <div>
          <span id="datetime-date-format-heading"
            class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
            Date
          </span>
          <div role="radiogroup" aria-labelledby="datetime-date-format-heading" class="flex flex-wrap gap-2">
            @for (choice of dateFormatChoices; track choice.value) {
            <button type="button" role="radio" [attr.aria-checked]="dateFormatDraft() === choice.value"
              (click)="dateFormatDraft.set(choice.value)"
              class="px-4 py-2 rounded-lg text-sm font-semibold border transition-colors
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]"
              [class.bg-[#1E3A5F]]="dateFormatDraft() === choice.value"
            [class.text-white]="dateFormatDraft() === choice.value"
            [class.border-[#1E3A5F]]="dateFormatDraft() === choice.value"
            [class.bg-white]="!(dateFormatDraft() === choice.value)"
            [class.text-gray-600]="!(dateFormatDraft() === choice.value)"
            [class.border-gray-200]="!(dateFormatDraft() === choice.value)">
              {{ choice.label }}
            </button>
            }
          </div>
        </div>
      </div>
    </section>
    <div class="flex items-center gap-2">
      <button type="button" (click)="save()"
        [disabled]="!dirty() || saving()"
        [attr.aria-busy]="saving()"
        class="bg-[#1E3A5F] text-white text-sm font-semibold px-4 py-2 rounded-md
               hover:bg-[#16304f] active:scale-95 transition-all motion-reduce:transition-none motion-reduce:active:scale-100
               disabled:opacity-40 disabled:hover:bg-[#1E3A5F] disabled:active:scale-100
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
        {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
      <button type="button" (click)="resetDraft()"
        [disabled]="!dirty() || saving()"
        class="text-sm text-gray-500 hover:text-gray-700 px-3 py-2 rounded-md transition-colors
               disabled:opacity-40
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
        Annuler
      </button>
    </div>
    <p role="status" aria-live="polite" class="text-xs"
      [class.text-red-600]="statusIsError()"
      [class.text-emerald-600]="!statusIsError() && statusMessage()">
      {{ statusMessage() }}
    </p>
    }
  </div>
</div>

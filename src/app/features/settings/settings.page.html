<div class="bg-[#FAFAFA] h-screen overflow-hidden flex">
  <app-left-sidebar></app-left-sidebar>
  <div class="flex-1 min-w-0 h-screen overflow-hidden flex flex-col">
  <app-navbar role="cashier" [displayLabel]="displayLabel" [currentTime]="currentTime()" [showMenuButton]="false" [showBackButton]="true"></app-navbar>
  <main class="flex-1 min-h-0 overflow-y-auto px-4 sm:px-6 py-6">
    <div class="max-w-3xl mx-auto space-y-6">
      <section aria-labelledby="display-setting-heading"
        class="bg-white border border-gray-200 rounded-xl p-5 sm:p-6">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 id="display-setting-heading" class="text-base font-semibold text-[#1A1A1A]">
              {{ 'Affichage' | t }}
            </h2>
            <p class="text-xs text-gray-400 mt-0.5">
              {{ 'Thème, couleur de fond et taille de police.' | t }}
            </p>
          </div>
          <button type="button" (click)="goToDisplaySettings()"
            class="text-sm font-semibold text-[#1E3A5F] hover:underline px-3 py-2 rounded-md
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
            {{ 'Gérer →' | t }}
          </button>
        </div>
      </section>
      <section aria-labelledby="profile-setting-heading"
        class="bg-white border border-gray-200 rounded-xl p-5 sm:p-6">
        <div class="flex items-center justify-between gap-3">
          <div>
            <h2 id="profile-setting-heading" class="text-base font-semibold text-[#1A1A1A]">
              {{ 'Profil' | t }}
            </h2>
            <p class="text-xs text-gray-400 mt-0.5">
              {{ 'Nom affiché et mot de passe de votre compte.' | t }}
            </p>
          </div>
          <button type="button" (click)="goToProfile()"
            class="text-sm font-semibold text-[#1E3A5F] hover:underline px-3 py-2 rounded-md
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#1E3A5F]">
            {{ 'Gérer →' | t }}
          </button>
        </div>
      </section>
    </div>
  </main>
  <app-bottom-bar role="cashier"></app-bottom-bar>
  </div>
</div>

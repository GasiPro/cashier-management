@if (lines().length > 0) {
<div class="fixed inset-0 z-[100] bg-[#FAFAFA] flex items-center justify-center px-6 py-16" role="status" aria-live="polite">
  <div class="text-center max-w-2xl">
    <span
      class="w-20 h-20 sm:w-24 sm:h-24 rounded-full border-[5px] border-gray-200 border-t-[#1E3A5F]
             animate-spin [animation-duration:2.2s] motion-reduce:animate-none inline-block mb-12"></span>
    <p class="text-2xl sm:text-3xl lg:text-4xl font-light leading-relaxed text-[#1A1A1A]">
      <span class="block">Mise à jour effectuée.</span>
      <span class="block text-gray-500">Voici ce qui a changé :</span>
    </p>
    <ul class="mt-8 space-y-2 text-lg sm:text-xl text-[#1A1A1A]">
      @for (line of visibleLines(); track $index) {
      <li>{{ line }}</li>
      }
      @if (hiddenCount() > 0) {
      <li class="text-gray-500">+ {{ hiddenCount() }} autre{{ hiddenCount() > 1 ? 's' : '' }} modification{{ hiddenCount() > 1 ? 's' : '' }}</li>
      }
    </ul>
  </div>
</div>
}
